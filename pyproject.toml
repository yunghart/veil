[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veil-im"
version = "0.1.1"
description = "Experimental terminal messenger using authenticated encryption over Tor onion services"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Veil IM contributors"}]
keywords = ["tor", "terminal", "messaging", "privacy", "onion-service"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Chat",
  "Topic :: Security :: Cryptography",
]
dependencies = [
  "argon2-cffi>=21.1",
  "cryptography>=38",
  "prompt-toolkit>=3.0.36,<4",
  "stem>=1.8.1,<2",
  "platformdirs>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "build>=1.2", "ruff>=0.8"]

[project.scripts]
veil = "veil_im.cli:main"


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
