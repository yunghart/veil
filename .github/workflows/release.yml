name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as handle:
              print(tomllib.load(handle)['project']['version'])
          PY
          )
          test "$GITHUB_REF_NAME" = "v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Test
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e '.[dev]'
          python -m compileall -q src tests
          pytest -q
          ruff check .

      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          python -m build --wheel --outdir dist
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          OUT_DIR="$PWD/dist" ./scripts/build-binary-deb.sh
          git archive --format=zip --prefix="veil-im-$VERSION/" \
            --output="dist/veil-im-source-$VERSION.zip" HEAD
          (
            cd dist
            sha256sum *.whl *.deb *.zip > "veil-im-$VERSION-SHA256SUMS.txt"
          )

      - name: Verify binary deb reproducibility in this runner
        shell: bash
        run: |
          set -euo pipefail
          first=$(sha256sum "dist/veil-im_0.2.0-1_all.deb" | cut -d' ' -f1)
          tmp=$(mktemp -d)
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          OUT_DIR="$tmp" ./scripts/build-binary-deb.sh >/dev/null
          second=$(sha256sum "$tmp/veil-im_0.2.0-1_all.deb" | cut -d' ' -f1)
          test "$first" = "$second"

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.deb
            dist/*.zip
            dist/*SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Veil IM $VERSION" \
            --generate-notes
