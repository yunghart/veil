name: test

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src tests
      - run: pytest -q
      - run: ruff check .

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build
      - run: python -m build --wheel
      - run: SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct) ./scripts/build-binary-deb.sh
      - run: dpkg-deb --info dist/veil-im_0.2.0-1_all.deb
      - run: dpkg-deb --contents dist/veil-im_0.2.0-1_all.deb | grep '/usr/bin/veil$'
